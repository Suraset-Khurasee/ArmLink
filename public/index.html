<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArmLink — NERO arm control</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <h1>ArmLink</h1>
        <span id="status">Mock mode</span>
      </header>

      <section class="notice">
        Hardware disabled. Slider changes update the mock API only.
      </section>

      <section class="panel">
        <div class="panel-heading">
          <h2>Motor positions</h2>
          <button id="reset" type="button">Reset</button>
        </div>
        <div id="sliders" class="sliders"></div>
      </section>

      <section class="panel output-panel">
        <div class="panel-heading">
          <h2>API output</h2>
          <span id="request-state" class="request-state">Ready</span>
        </div>
        <pre id="output" aria-live="polite"></pre>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
